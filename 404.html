    <script>
      (() => {
        const legacyPrefix = "/RoboRPT-Site";

        function normalizedPath(pathname) {
          let value = pathname.replace(/\/+$/, "") || "/";
          if (value.startsWith(`${legacyPrefix}/`)) {
            value = value.slice(legacyPrefix.length) || "/";
          }
          return value;
        }

        function accountPage(pathname) {
          const value = normalizedPath(pathname);
          if (value === "/sign-in") return "/sign-in/";
          if (value === "/create-account" || value === "/signup") {
            return "/create-account/";
          }
          return null;
        }

        const initialDestination = accountPage(window.location.pathname);
        if (
          initialDestination &&
          window.location.pathname !== initialDestination
        ) {
          window.location.replace(
            `${initialDestination}${window.location.search}${window.location.hash}`,
          );
          return;
        }

        document.addEventListener(
          "click",
          (event) => {
            if (
              event.button !== 0 ||
              event.metaKey ||
              event.ctrlKey ||
              event.shiftKey ||
              event.altKey
            ) {
              return;
            }

            const link =
              event.target instanceof Element
                ? event.target.closest("a[href]")
                : null;
            if (!link || link.hasAttribute("download")) return;
            if (link.target && link.target !== "_self") return;

            const url = new URL(link.href, window.location.href);
            if (url.origin !== window.location.origin) return;

            const destination = accountPage(url.pathname);
            if (!destination) return;

            event.preventDefault();
            event.stopImmediatePropagation();
            window.location.assign(`${destination}${url.search}${url.hash}`);
          },
          true,
        );

        window.addEventListener("popstate", () => {
          const destination = accountPage(window.location.pathname);
          if (
            destination &&
            window.location.pathname !== destination
          ) {
            window.location.replace(
              `${destination}${window.location.search}${window.location.hash}`,
            );
          }
        });
      })();
    </script>
    <script>
      (() => {
        const legacyPrefix = "/RoboRPT-Site/";

        function repairImage(image) {
          const source = image.getAttribute("src");
          if (!source) return;

          try {
            const url = new URL(source, window.location.origin);
            if (!url.pathname.startsWith(legacyPrefix)) return;
            image.src = `/${url.pathname.slice(legacyPrefix.length)}${url.search}${url.hash}`;

            // Leave unrelated or malformed image URLs unchanged.
          }

        document.addEventListener(
          "error",
          (event) => {
            if (event.target instanceof HTMLImageElement) {
              repairImage(event.target);
            }
          },
          true,
        );

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            if (
              mutation.type === "attributes" &&
              mutation.target instanceof HTMLImageElement
            ) {
              repairImage(mutation.target);
              continue;
            }

            for (const node of mutation.addedNodes) {
              if (!(node instanceof Element)) continue;
              if (node instanceof HTMLImageElement) repairImage(node);
              node.querySelectorAll?.("img").forEach(repairImage);
            }
          }
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["src"],
        });
      })();
