    <style>
      .roborpt-signup-option {
        width: 100%;
        margin-top: 14px;
        display: grid;
        gap: 10px;
        text-align: center;
      }

      .roborpt-signup-option p {
        margin: 0;

      .roborpt-signup-button {
        width: 100%;

        justify-content: center;

    <script>
      (() => {
        const legacyPrefix = "/RoboRPT-Site/";

        function repairImage(image) {
          const source = image.getAttribute("src");
          if (!source) return;

          try {
            const url = new URL(source, window.location.origin);
            if (!url.pathname.startsWith(legacyPrefix)) return;
            image.src = `/${url.pathname.slice(legacyPrefix.length)}${url.search}${url.hash}`;
          } catch {
            // Leave unrelated or malformed image URLs unchanged.
          }
        }

        document.addEventListener(
          "error",
          (event) => {
            if (event.target instanceof HTMLImageElement) {
              repairImage(event.target);
            }
          },
          true,
        );

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            if (mutation.type === "attributes" && mutation.target instanceof HTMLImageElement) {
              repairImage(mutation.target);
              continue;
            }

            for (const node of mutation.addedNodes) {
              if (!(node instanceof Element)) continue;
              if (node instanceof HTMLImageElement) repairImage(node);
              node.querySelectorAll?.("img").forEach(repairImage);
            }
          }
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["src"],
        });
      })();
    </script>
    <script>
      (() => {
        const signUpUrl = "https://app.roborpt.com/create-account";
        let updateScheduled = false;

        function isSignInPage() {
          let pathname = window.location.pathname.replace(/\/+$/, "") || "/";
          if (pathname.startsWith("/RoboRPT-Site/")) {
            pathname = pathname.slice("/RoboRPT-Site".length);
          }
          return pathname === "/sign-in";
        }

        function addSignUpOption() {
          updateScheduled = false;
          const existing = document.querySelector(".roborpt-signup-option");

          if (!isSignInPage()) {
            existing?.remove();
            return;
          }

          const panel = document.querySelector(".utility-panel");
          const form = panel?.querySelector("form");
          if (!panel || !form || existing) return;

          const option = document.createElement("div");
          option.className = "roborpt-signup-option";

          const prompt = document.createElement("p");
          prompt.textContent = "New to RoboRPT?";

          const link = document.createElement("a");
          link.className = "button button-secondary roborpt-signup-button";
          link.href = signUpUrl;
          link.textContent = "Sign Up";
          link.setAttribute("aria-label", "Create a RoboRPT account");

          option.append(prompt, link);
          form.insertAdjacentElement("afterend", option);
        }

        function scheduleUpdate() {
          if (updateScheduled) return;
          updateScheduled = true;
          queueMicrotask(addSignUpOption);
        }

        new MutationObserver(scheduleUpdate).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });

        window.addEventListener("popstate", scheduleUpdate);
        window.addEventListener("pageshow", scheduleUpdate);
        document.addEventListener("DOMContentLoaded", scheduleUpdate, { once: true });
        scheduleUpdate();
      })();
    </script>
