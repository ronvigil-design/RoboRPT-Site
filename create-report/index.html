<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open the secure RoboRPT report workspace." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/logo-roborpt.png" />
    <link rel="canonical" href="https://app.roborpt.com/report-app" />
    <title>Opening Report Workspace | RoboRPT</title>
    <script>
      window.location.replace(
        `https://app.roborpt.com/report-app${window.location.search}${window.location.hash}`,
      );
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        background: radial-gradient(circle at 50% 10%, rgba(8,125,255,.24), transparent 38%), #01040a;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      main { width: min(100%, 460px); }
      img { width: 86px; height: 86px; border-radius: 50%; }
      h1 { margin: 18px 0 10px; font-size: 32px; }
      p { margin: 0 0 22px; color: #b6c2cf; line-height: 1.6; }
      a {
        min-height: 50px;
        padding: 13px 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(135deg, #087dff, #075bd8);
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-roborpt.png" alt="RoboRPT" />
      <h1>Opening your secure report workspace</h1>
      <p>RoboRPT is taking you to the account-backed app so your reports can be saved to your account.</p>
      <a href="https://app.roborpt.com/report-app">Continue to RoboRPT</a>
    </main>
  </body>
</html>
